spring:
  application:
    name: jasper-to-pdf
  datasource:
    url: jdbc:postgresql://127.0.0.1:5435/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      lifecycle-management: start_only

server:
  port: 8085
